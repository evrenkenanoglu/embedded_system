# ==============================================================================
# Python Project Formatting & Style Rules
# ==============================================================================

[project]
name = "code-formatter"
version = "0.1.0"
description = "Multi-language project code formatter"
requires-python = ">=3.10"

# ==============================================================================
# 1. Black Formatter Settings (Code Formatting)
# ==============================================================================
[tool.black]
# Target Python language features
target-version = ["py310", "py311", "py312"]

# Maximum line length (PEP 8 standard default for Black is 88)
line-length = 88

# Enforce consistent double quotes ("text" instead of 'text')
skip-string-normalization = false

# Keep magic trailing commas to control multiline wrapping
skip-magic-trailing-comma = false

# Exclude generated/virtual environment directories
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

# ==============================================================================
# 2. isort Settings (Import Sorting & Grouping)
# ==============================================================================
[tool.isort]
# Ensure isort formatting matches Black's style rules
profile = "black"

# Match Black's line length limit
line_length = 88

# Combine imports from the same module (e.g. `from typing import Any, List`)
combine_as_imports = true

# Separate imports with a single line between third-party and local packages
lines_after_imports = 2

# Sort imports case-insensitively
force_sort_within_sections = false

# ==============================================================================
# 3. Ruff Settings (Fast Linting & Formatting Alternative)
# ==============================================================================
[tool.ruff]
# Target minimum Python version
target-version = "py310"

# Line length limit (matches Black)
line-length = 88

[tool.ruff.lint]
# Select rules:
# E/W = Pycodestyle (errors/warnings)
# F   = Pyflakes (unused variables, undefined names)
# I   = isort (import sorting)
# B   = flake8-bugbear (common bug patterns)
# UP  = pyupgrade (modern Python syntax upgrades)
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

# Specific rules to ignore if needed (e.g., E501 line-too-long handled by formatter)
ignore = [
    "E501", # Line length is handled automatically by formatter
]

[tool.ruff.format]
# Quote style: double quotes are standard
quote-style = "double"

# Indent style: 4 spaces standard PEP 8
indent-style = "space"

# Keep docstrings clean and standardized
docstring-code-format = true