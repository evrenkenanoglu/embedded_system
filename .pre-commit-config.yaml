---
# ==============================================================================
# Pre-Commit Configuration (.pre-commit-config.yaml)
# Project: Embedded_IoT_BT_WIFI_Base_Project
# ==============================================================================
repos:
  # 1. Standard File Hygiene & Syntax Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        exclude: ^(build/|Out/)
      - id: check-added-large-files
        args: [--maxkb=5000]

  # 2. In-Repo Multi-Language Formatter (Cross-Platform Execution)
  - repo: local
    hooks:
      - id: format-staged
        name: In-Repo Formatter (C++, Python, YAML, CMake)
        entry: python3 -c "import subprocess, sys; sys.exit(subprocess.run([sys.executable,
          '-m', 'invoke', 'es.util.format-apply', '--lang=all', '--scope=changed'],
          cwd='..').returncode)"
        language: system
        pass_filenames: false
        always_run: true
