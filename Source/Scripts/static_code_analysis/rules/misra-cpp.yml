rules:
  # MISRA C++ 2008 Critical Rules for Embedded/IoT Systems
  
  - id: misra-cpp-2-10-6-unsafe-sprintf
    patterns:
      - pattern-either:
          - pattern: sprintf($BUF, $FMT, ...)
          - pattern: std::sprintf($BUF, $FMT, ...)
    message: "MISRA C++ 2-10-6: sprintf can cause buffer overflow - use snprintf"
    languages: [c, cpp]
    severity: ERROR
    metadata:
      category: security
      technology: [embedded, iot]
      references:
        - "MISRA C++ 2008 Rule 2-10-6"
        - "Use bounded string functions"

  - id: misra-cpp-5-0-3-casts-explicit
    patterns:
      - pattern: ($TYPE) $EXPR
      - pattern-not: static_cast<$TYPE>($EXPR)
      - pattern-not: const_cast<$TYPE>($EXPR)
      - pattern-not: dynamic_cast<$TYPE>($EXPR)
      - pattern-not: reinterpret_cast<$TYPE>($EXPR)
    message: "MISRA C++ 5-0-3: Use explicit C++ casts instead of C-style casts"
    languages: [cpp]
    severity: WARNING
    metadata:
      category: best-practice
      technology: [cpp]

  - id: misra-cpp-5-0-4-implicit-conversion
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR = $EXPR;
          - pattern: |
              $VAR = $EXPR;
      - metavariable-comparison:
          comparison: $TYPE != typeof($EXPR)
    message: "MISRA C++ 5-0-4: Avoid implicit conversions that may lose information"
    languages: [cpp]
    severity: WARNING
    metadata:
      category: reliability

  - id: misra-cpp-6-4-2-switch-default
    patterns:
      - pattern: |
          switch ($EXPR) {
            $...CASES
          }
      - pattern-not: |
          switch ($EXPR) {
            $...CASES
            default:
              $...STMTS
          }
    message: "MISRA C++ 6-4-2: All switch statements should have a default clause"
    languages: [c, cpp]
    severity: WARNING
    metadata:
      category: reliability

  - id: misra-cpp-8-4-4-single-definition
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $FUNC($...PARAMS);
              ...
              $TYPE $FUNC($...PARAMS) { $...BODY }
              ...
              $TYPE $FUNC($...PARAMS) { $...BODY2 }
    message: "MISRA C++ 8-4-4: A function should be defined only once"
    languages: [c, cpp]
    severity: ERROR
    metadata:
      category: correctness

  - id: misra-cpp-15-1-2-exception-safety
    patterns:
      - pattern-either:
          - pattern: |
              $PTR = new $TYPE($...ARGS);
              ...
              throw $EXCEPTION;
          - pattern: |
              $PTR = malloc($SIZE);
              ...
              throw $EXCEPTION;
    message: "MISRA C++ 15-1-2: Potential memory leak before exception"
    languages: [cpp]
    severity: ERROR
    metadata:
      category: memory-safety

  - id: misra-cpp-15-3-4-no-exception-spec
    patterns:
      - pattern: |
          $TYPE $FUNC($...PARAMS) throw($...SPECS) { $...BODY }
    message: "MISRA C++ 15-3-4: Exception specifications are deprecated"
    languages: [cpp]
    severity: WARNING
    metadata:
      category: best-practice

  - id: misra-cpp-18-4-1-malloc-free-pairing
    patterns:
      - pattern-either:
          - pattern: |
              $PTR = malloc($SIZE);
              ...
              return $RET;
          - pattern: |
              $PTR = calloc($NUM, $SIZE);
              ...
              return $RET;
      - pattern-not: |
          $PTR = malloc($SIZE);
          ...
          free($PTR);
          ...
          return $RET;
    message: "MISRA C++ 18-4-1: malloc/free must be properly paired"
    languages: [c, cpp]
    severity: ERROR
    metadata:
      category: memory-safety

  - id: misra-cpp-macro-multiple-statements
    patterns:
      - pattern: |
          #define $MACRO(...) $STMT1; $STMT2; $...STMTS
      - pattern-not: |
          #define $MACRO(...) do { $...STMTS } while(0)
    message: "MISRA C++ Best Practice: Multi-statement macros should use do-while(0)"
    languages: [c, cpp]
    severity: WARNING
    metadata:
      category: best-practice

  - id: misra-cpp-variable-initialization
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR;
              $...STMTS
              $VAR = $VALUE;
          - pattern: |
              $TYPE $VAR;
              if ($COND) {
                $VAR = $VALUE;
              }
    message: "MISRA C++ Best Practice: Variables should be initialized at declaration"
    languages: [c, cpp]
    severity: INFO
    metadata:
      category: initialization

  - id: misra-cpp-goto-statement
    patterns:
      - pattern: goto $LABEL;
    message: "MISRA C++ 6-6-1: goto statements should not be used"
    languages: [c, cpp]
    severity: WARNING
    metadata:
      category: control-flow

  - id: misra-cpp-magic-numbers
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = $NUM;
          - pattern: |
              if ($EXPR $OP $NUM) { $...STMTS }
          - pattern: |
              for ($INIT; $COND $OP $NUM; $UPDATE) { $...STMTS }
      - metavariable-regex:
          metavariable: $NUM
          regex: ^[0-9]{2,}$
      - pattern-not-inside: |
          #define $CONST $NUM
    message: "MISRA C++ Best Practice: Avoid magic numbers, use named constants"
    languages: [c, cpp]
    severity: INFO
    metadata:
      category: readability