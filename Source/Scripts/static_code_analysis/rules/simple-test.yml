rules:
  - id: simple-test-function-call
    pattern: $FUNC(...)
    message: "Found any function call"
    languages: [c, cpp]
    severity: INFO
    
  - id: simple-test-include
    pattern: "#include $HEADER"
    message: "Found include statement"
    languages: [c, cpp]
    severity: INFO
    
  - id: simple-test-return
    pattern: "return $VALUE;"
    message: "Found return statement"
    languages: [c, cpp]
    severity: INFO