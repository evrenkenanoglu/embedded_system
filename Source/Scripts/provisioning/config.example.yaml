# ==============================================================================
# Application-Specific Provisioning Configuration
# (For Embedded_IoT_BT_WIFI_Base_Project)
# ==============================================================================

# Root Directory Variables
environment:
  project_root_dir: "."                                         # Application Root (Embedded_IoT_BT_WIFI_Base_Project)
  embedded_system_dir: "{project_root_dir}/embedded_system"     # Reusable Library Submodule

# Paths & File Definitions (Relative to Application Root)
paths:
  partitions_csv: "{project_root_dir}/partitions.csv"
  output_dir: "{project_root_dir}/build/provisioning"
  firmware_dir: "{project_root_dir}/build"
  keys_dir: "{project_root_dir}/keys"
  certs_dir: "{project_root_dir}/certs"
  audit_dir: "{project_root_dir}/build/audit_logs"
  server_manifest: "{project_root_dir}/Tools/OTA/ota-server/firmware_storage/manifest.json"

# 1. Generic NVS Partition Generation
nvs_generation:
  target_partition: "fctry"
  template_csv: "{embedded_system_dir}/Source/Scripts/provisioning/nvs/templates/nvs_ota_template.csv"
  output_key_bin: "{output_dir}/nvs_keys.bin"
  output_encrypted_bin: "{output_dir}/nvs_encrypted.bin"
  template_variables:
    DEVICE_ID: "DEV-ESP32S3-001"
    HW_REV: "ESP32-S3-WROOM"
    HSVN: 1
    CHANNEL: "stable"
    API_KEY: "secure-device-token-factory-001"
    GATEWAY_URL: "https://192.168.1.100:8443"
    ROOT_CA_PATH: "{certs_dir}/ca.crt"

# 2. Release & Code-Signing Pipeline
signing:
  version: "1.0.0"
  binary_name: "Embedded_IoT_BT_WIFI_Base_Project.bin" # Matches your project CMake target
  key_type: "ec-secp256r1"
  signing_key_pem: "{certs_dir}/signing.key"
  signing_cert_pem: "{certs_dir}/signing.crt"
  out_signature_bin: "{output_dir}/target_signature.sig"
  manifest_metadata:
    channel: "stable"
    hardware_device: "ESP32-S3-WROOM"
    target_hsvn: 1
    canary_percentage: 100

# 3. Hardware Silicon Provisioning & Flashing
hardware:
  port: "/dev/ttyUSB0"                                 # Adjust for WSL (or COMx on Windows)
  baud: 460800
  chip: "esp32s3"
  flash_mode: "dio"
  flash_freq: "80m"
  flash_size: "16MB"
  dry_run: true
  force_burn: false

  efuse_keys:
    - block: "BLOCK_KEY0"
      key_file: "{keys_dir}/flash_encryption_key.bin"
      purpose: "FLASH_ENCRYPTION"
    - block: "BLOCK_KEY1"
      key_file: "{keys_dir}/secure_boot_digest.bin"
      purpose: "SECURE_BOOT_DIGEST0"

  efuse_registers:
    - name: "DIS_PAD_JTAG"
      value: "1"
    - name: "DIS_USB_JTAG"
      value: "1"
    - name: "DIS_DIRECT_BOOT"
      value: "1"
    - name: "DIS_DOWNLOAD_ICACHE"
      value: "1"
    - name: "DIS_DOWNLOAD_DCACHE"
      value: "1"
    - name: "SECURE_VERSION"
      value: "1"

  # Standard ESP-IDF 5.x build paths
  flash_targets:
    __bootloader__: "{firmware_dir}/bootloader/bootloader.bin"
    __partition_table__: "{firmware_dir}/partition_table/partition-table.bin"
    nvs_keys: "{output_dir}/nvs_keys.bin"
    fctry: "{output_dir}/nvs_encrypted.bin"
    ota_0: "{firmware_dir}/Embedded_IoT_BT_WIFI_Base_Project.bin"