<!DOCTYPE html>
<html>

<head>
    <title>Socket Control</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --button-width: 90%;
            --button-height: 90%;
            --button-border-color: #404040;
            --button-on-color: #00ff00;
            --button-off-color: #ff0000;
            --icon-color: #2bff00;
            --icon-size: 36px;
        }

        .button-container {
            width: var(--button-width);
            height: var(--button-height);
            position: relative;
            border: none;
            /* Remove default button border */
            background: none;
            /* Remove default button background */
            padding: 0;
            /* Remove default button padding */
            outline: none;
            /* Remove default button outline */
            cursor: pointer;
            /* Ensure the cursor is a pointer */
            display: flex;
            /* Center the content */
            justify-content: center;
            /* Center the content */
            align-items: center;
            /* Center the content */
        }

        .button-outer-circle {
            fill: rgb(255, 255, 255);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #7e7d7d;
            box-sizing: border-box;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2), 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .button-state-circle {
            fill: #ffffff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 13px solid #ff0000;
            box-sizing: border-box;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2), 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .button-inner-circle {
            background: linear-gradient(135deg, #ffffff, #7e7d7d);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-sizing: border-box;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: all 0.3s ease;
            box-shadow: inset 0px 4px 8px rgba(0, 0, 0, 0.2), inset 0px -4px 8px rgba(255, 255, 255, 0.1),
                /* Enhanced shadow for 3D effect */
                0px 4px 8px rgba(0, 0, 0, 0.2), 0px -4px 8px rgba(255, 255, 255, 0.1);
            /* Outer shadow for 3D effect */
        }

        .icon {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .fa-power-off {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .button-container:hover .button-state-circle,
        .button-container:hover .button-outer-circle,
        .button-container:hover .button-inner-circle {
            filter: brightness(95%);
            box-shadow: 0px 12px 20px rgba(0, 0, 0, 0.3), 0px 6px 10px rgba(0, 0, 0, 0.15);
        }

        .button-container:hover .fa-power-off {
            filter: brightness(90%);
        }

        form {
            border: 1px dotted gray;
            padding: 10px;
            box-shadow: 10px 20px 10px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            width: 60%;
            margin: 10px auto;
        }

        h1,
        h2 {
            text-align: center;
            font-size: 4em;
            font-family: 'Arial', sans-serif, bold;
            background: -webkit-linear-gradient(left, #007BFF, #00C6FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin-bottom: 0;
        }

        h2 {
            margin-top: 0;
        }

        .socket-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            border-radius: 25px;
            border: 2px solid #ccc;
            background-color: #E9ECEF;
            box-shadow: 10px 20px 10px rgba(0, 0, 0, 0.2);
            background: linear-gradient(145deg, #5d5a5a, #c7c6d4);
            box-shadow: 20px 20px 60px #d9d9d9, -20px -20px 60px #ffffff;
        }

        .status-indicator {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: -2;
            transition: background 0.3s ease;
        }

        .status-indicator.on {
            background: linear-gradient(145deg, #28a745, #218838);
        }

        .status-indicator.off {
            background: linear-gradient(145deg, #dc3545, #c82333);
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            justify-items: center;
            align-items: center;
            gap: 10px;
            padding: 0 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <form>
            <h1 class="mt-4">UNIVERSE HOME</h1>
            <h2 class="mb-4">Socket Control</h2>
            <div class="socket-container" style="margin: 0 auto 20px auto;">
                <button id="buttonToggleAll" class="btn button-container off">
                    <div class="button-state-circle"></div>
                    <div class="button-outer-circle"></div>
                    <div class="button-inner-circle">
                        <div class="icon">
                            <i class="fas fa-power-off"></i>
                        </div>
                    </div>
                </button>
            </div>
            <div id="controls">
                <script>
                    document.addEventListener('DOMContentLoaded', (event) => {
                        document.querySelector('form').addEventListener('submit', function (event) {
                            event.preventDefault();
                        });


                        ButtonIndexAll = 0xFF;
                        const sockets = [];
                        let clickTimeout = null;
                        let longPressTimeout = null;
                        const longPressDuration = 500;
                        const responseFromHardwareTimeout = 500;

                        const colorStateOff = '#ff0000';
                        const colorStateOn = '#00ff00';

                        const socketStateMap = new Map();

                        for (let i = 0; i < 10; i++) {
                            socketStateMap.set(i, false);
                        }
                        socketStateMap.set(ButtonIndexAll, true);

                        async function handleSwitchState(button, index) {
                            try {
                                const getToggledState = !socketStateMap.get(index) ? 1 : 0;
                                const response = await fetch('/power-switches-control', {
                                    method: 'PUT',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ socketId: index, state: getToggledState }),
                                    timeout: responseFromHardwareTimeout
                                });

                                if (response.ok) {

                                    toggleButtonState(index);
                                    updateSocketMap(index);

                                } else {
                                    alert('Error: ' + response.status);
                                }
                            } catch (error) {
                                alert('Error: ' + error.message);
                            }
                        }

                        function updateSocketMap(index) {
                            if (index === ButtonIndexAll) {
                                sockets.forEach((button, i) => {
                                    socketStateMap.set(i, !socketStateMap.get(index));
                                });
                            }

                            socketStateMap.set(index, !socketStateMap.get(index));
                        }

                        function toggleButtonState(index) {

                            if (index === ButtonIndexAll) {
                                sockets.forEach((button, i) => {
                                    setButtonState(i, !socketStateMap.get(index));
                                });
                            } else {
                                setButtonState(index, !socketStateMap.get(index));
                            }
                        }

                        function setButtonState(index, state) {
                            const button = sockets[index];
                            const stateCircle = button.querySelector('.button-state-circle');
                            const powerIcon = button.querySelector('.fa-power-off');
                            const isOn = state === true;

                            if (isOn) {
                                stateCircle.style.borderColor = colorStateOn;
                                powerIcon.style.color = colorStateOn;
                            } else {
                                stateCircle.style.borderColor = colorStateOff;
                                powerIcon.style.color = colorStateOff;
                            }
                        }

                        function startLongPress(button, index) {
                            longPressTimeout = setTimeout(() => {
                                handleSwitchState(button, index);
                            }, longPressDuration);
                        }

                        function cancelLongPress() {
                            if (longPressTimeout !== null) {
                                clearTimeout(longPressTimeout);
                                longPressTimeout = null;
                            }
                        }

                        for (let i = 0; i < 10; i++) {
                            const container = document.createElement('div');
                            container.className = 'socket-container';

                            const button = document.createElement('button');
                            button.className = 'btn button-container off';


                            const buttonStateCircle = document.createElement('div');
                            buttonStateCircle.className = 'button-state-circle';

                            const buttonOuterCircle = document.createElement('div');
                            buttonOuterCircle.className = 'button-outer-circle';

                            const buttonInnerCircle = document.createElement('div');
                            buttonInnerCircle.className = 'button-inner-circle';

                            const icon = document.createElement('div');
                            icon.className = 'icon';

                            const iconPower = document.createElement('i');
                            iconPower.className = 'fas fa-power-off';

                            icon.append(iconPower);
                            buttonInnerCircle.append(icon);
                            button.append(buttonStateCircle);
                            button.append(buttonOuterCircle);
                            button.append(buttonInnerCircle);



                            button.addEventListener('click', function (event) {
                                event.preventDefault();
                                if (clickTimeout !== null) {
                                    clearTimeout(clickTimeout);
                                    clickTimeout = null;
                                    handleSwitchState(button, i);
                                } else {
                                    clickTimeout = setTimeout(() => {
                                        clickTimeout = null;
                                    }, 300);
                                }
                            });

                            button.addEventListener('mousedown', function (event) {
                                event.preventDefault();
                                startLongPress(button, i);
                            });

                            button.addEventListener('mouseup', function (event) {
                                event.preventDefault();
                                cancelLongPress();
                            });

                            button.addEventListener('mouseleave', function (event) {
                                event.preventDefault();
                                cancelLongPress();
                            });

                            button.addEventListener('touchstart', function (event) {
                                event.preventDefault();
                                startLongPress(button, i);
                            });

                            button.addEventListener('touchend', function (event) {
                                event.preventDefault();
                                cancelLongPress();
                            });

                            button.addEventListener('touchcancel', function (event) {
                                event.preventDefault();
                                cancelLongPress();
                            });





                            sockets.push(button);

                            container.append(button);
                            document.getElementById('controls').append(container);
                        }

                        const toggleAllButton = document.getElementById('buttonToggleAll');

                        toggleAllButton.addEventListener('touchstart', function (event) {
                            event.preventDefault();
                            startLongPress(this, ButtonIndexAll);
                        });

                        toggleAllButton.addEventListener('touchend', function (event) {
                            event.preventDefault();
                            cancelLongPress();
                        });


                        toggleAllButton.addEventListener('touchcancel', function (event) {
                            event.preventDefault();
                            cancelLongPress();
                        });

                        toggleAllButton.addEventListener('mousedown', function (event) {
                            event.preventDefault();
                            startLongPress(this, ButtonIndexAll);
                        });

                        toggleAllButton.addEventListener('mouseup', function (event) {
                            event.preventDefault();
                            cancelLongPress();
                        });

                        toggleAllButton.addEventListener('mouseleave', function (event) {
                            event.preventDefault();
                            cancelLongPress();
                        });

                        document.getElementById('buttonToggleAll').addEventListener('click', function (event) {
                            event.preventDefault();
                            if (clickTimeout !== null) {
                                clearTimeout(clickTimeout);
                                clickTimeout = null;
                                handleSwitchState(this, ButtonIndexAll);
                            } else {
                                clickTimeout = setTimeout(() => {
                                    clickTimeout = null;
                                }, 300);
                            }
                        });
                    });
                </script>
            </div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
