<!DOCTYPE html>
<html>
<head>
    <title>Power Button</title>
    <style>
        .power-icon {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 7px solid black;
            box-sizing: border-box;
            clip-path: circle(50% at 50% 50%);
        }

        .inner-clip {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            position: absolute;
            top: 7px;
            left: 7px;
        }

        .vertical-line {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -10%);
            width: 7px;
            height: 40%;
            background-color: black;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="power-icon">
        <div class="circle">
            <div class="inner-clip"></div>
        </div>
        <div class="vertical-line"></div>
    </div>
</body>
</html>
