<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
  <title>
   Device Dashboard
  </title>
  <link href="css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div style="text-align: center; padding: 10px 0;">
    <div style="text-align: center; padding: 5px 0 10px 0;">
     <span style="font-family: 'Arial Black', Gadget, sans-serif; font-size: 45px; font-weight: 900; color: #eee;">
      UNIVERSE
      <span style="color: #b85c5c; font-weight: normal; font-family: Arial, sans-serif;">
       Home
      </span>
     </span>
    </div>
    <h1>
     Control Panel
    </h1>
   </div>
  </header>
  <main id="welcome-page">
   <div class="icon-grid">
    <a class="icon-button" href="wifiSetup" id="wifi-button">
     <div class="icon-symbol">
      📶
     </div>
     <div class="icon-label">
      WiFi Setup
     </div>
    </a>
    <a class="icon-button" href="applications" id="app-button">
     <div class="icon-symbol">
      🚀
     </div>
     <div class="icon-label">
      Applications
     </div>
    </a>
    <a class="icon-button" href="settings" id="settings-button">
     <div class="icon-symbol">
      ⚙️
     </div>
     <div class="icon-label">
      Settings
     </div>
    </a>
   </div>
  </main>
  <footer>
   <p>
    Device OS v1.0
   </p>
  </footer>
 </body>
</html>
