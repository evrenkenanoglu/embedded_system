<!DOCTYPE html>
<html>

<head>
  <title>Socket Control</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    :root {
      --button-width: 200px;
      --button-height: 200px;
      --button-border-color: #404040;
      --button-on-color: #00ff00;
      --button-off-color: #ff0000;
      --icon-color: #2bff00;
      --icon-size: 36px;
    }

    .button-container {
      width: var(--button-width);
      height: var(--button-height);
      position: relative;
    }

    .button-outer-circle {
      fill: rgb(255, 255, 255);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #7e7d7d;
      box-sizing: border-box;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      z-index: 2;
      box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2), 0px 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .button-state-circle {
      fill: #ffffff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 13px solid #00ff00;
      box-sizing: border-box;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      z-index: 2;
      box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2), 0px 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .button-inner-circle {
      background: linear-gradient(135deg, #ffffff, #7e7d7d);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-sizing: border-box;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      z-index: 1;
      transition: all 0.3s ease;
      box-shadow: inset 0px 4px 8px rgba(0, 0, 0, 0.2), inset 0px -4px 8px rgba(255, 255, 255, 0.1), /* Enhanced shadow for 3D effect */
              0px 4px 8px rgba(0, 0, 0, 0.2), 0px -4px 8px rgba(255, 255, 255, 0.1); /* Outer shadow for 3D effect */
    }

    .icon {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .fa-power-off {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      color: #2bff00;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .button-container:hover .button-state-circle,
    .button-container:hover .button-outer-circle,
    .button-container:hover .button-inner-circle {
      filter: brightness(95%);
      box-shadow: 0px 12px 20px rgba(0, 0, 0, 0.3), 0px 6px 10px rgba(0, 0, 0, 0.15);
    }

    .button-container:hover .fa-power-off {
      filter: brightness(90%);
    }
  </style>
</head>

<body>

  <div class="button-container" onclick="toggleButtonState()">
    <div class="button-state-circle"></div>
    <div class="button-outer-circle"></div>
    <div class="button-inner-circle">
      <div class="icon">
        <i class="fas fa-power-off"></i>
      </div>
    </div>
  </div>
  <div class="button-container" onclick="toggleButtonState()">
    <div class="button-state-circle"></div>
    <div class="button-outer-circle"></div>
    <div class="button-inner-circle">
      <div class="icon">
        <i class="fas fa-power-off"></i>
      </div>
    </div>
  </div>

  <script>
    function toggleButtonState() {
      const stateCircle = document.querySelector('.button-state-circle');
      const powerIcon = document.querySelector('.fa-power-off');
      const isOn = stateCircle.style.borderColor === 'rgb(0, 255, 0)';

      if (isOn) {
        stateCircle.style.borderColor = '#ff0000';
        powerIcon.style.color = '#ff0000';
      } else {
        stateCircle.style.borderColor = '#00ff00';
        powerIcon.style.color = '#00ff00';
      }
    }
  </script>

</body>

</html>
